<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clerk Test Token</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    #token-box { word-break: break-all; background: #f4f4f4; padding: 12px; border-radius: 6px; font-size: 12px; margin-top: 16px; }
    button { padding: 8px 16px; margin-top: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Clerk Test Token Generator</h2>
  <p>Sign in below, then copy the session token to use in curl / Postman.</p>

  <div id="sign-in"></div>
  <div id="user-info" style="display:none;">
    <p>Signed in ✅</p>
    <button id="get-token">Get Session Token</button>
    <div id="token-box"></div>
  </div>

  <!-- Replace with your Clerk Publishable Key -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="PASTE_YOUR_PUBLISHABLE_KEY_HERE"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script>
    window.addEventListener("load", async () => {
      await window.Clerk.load();

      if (window.Clerk.user) {
        document.getElementById("sign-in").style.display = "none";
        document.getElementById("user-info").style.display = "block";
      } else {
        window.Clerk.mountSignIn(document.getElementById("sign-in"));
      }

      window.Clerk.addListener(async ({ user }) => {
        if (user) {
          document.getElementById("sign-in").style.display = "none";
          document.getElementById("user-info").style.display = "block";
        }
      });

      document.getElementById("get-token").addEventListener("click", async () => {
        const token = await window.Clerk.session.getToken();
        document.getElementById("token-box").innerText = token;
        console.log("TOKEN:", token);
      });
    });
  </script>
</body>
</html>
